spring.application.name=jobportal
server.port=8080
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.datasource.url=jdbc:mysql://localhost:3306/job_portal
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Demo admin is created on first startup if no admin exists.
# Set these environment variables before using outside a local demo.
jobportal.admin.email=${ADMIN_EMAIL:admin@jobconnect.com}
jobportal.admin.password=${ADMIN_PASSWORD:Admin@123}
